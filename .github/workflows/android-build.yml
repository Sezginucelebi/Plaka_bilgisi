name: Auto Build and Release

on:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # google-services.json dosyası GitHub'da yoksa build'i bozmasın diye düzeltilmiş dummy
    - name: Ensure Firebase config
      run: |
        mkdir -p app/
        if [ ! -f app/google-services.json ]; then
          echo '{"project_info":{"project_id":"dummy-id"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:com.sezgin.plaka_bilgisi"},"api_key":[{"current_key":"dummy-key"}]}]}' > app/google-services.json
        fi

    - name: Build Android APK (Debug)
      run: ./gradlew :app:assembleDebug --stacktrace
      
    - name: Generate Tag Name
      id: tag
      run: echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/debug/*.apk
        tag_name: ${{ steps.tag.outputs.TAG_NAME }}
        name: Auto Release ${{ steps.tag.outputs.TAG_NAME }}
        body: "Otomatik oluşturulan Android APK sürümü."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
