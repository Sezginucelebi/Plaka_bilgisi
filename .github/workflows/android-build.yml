name: Build and Release

on:
  push:
    tags:
      - 'v*' # v1.0, v2.1.0 gibi bir tag atıldığında çalışır

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release oluşturmak için izin gerekir

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Android APK
      run: ./gradlew :app:assembleRelease
      
    - name: Build Desktop App (MSI/EXE)
      run: ./gradlew :desktop:package
      
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          app/build/outputs/apk/release/*.apk
          desktop/build/compose/binaries/main-release/msi/*.msi
          desktop/build/compose/binaries/main-release/exe/*.exe
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
