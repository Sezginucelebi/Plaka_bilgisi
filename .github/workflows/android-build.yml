name: Auto Build and Release

on:
  push:
    branches: [ "main" ] # Sadece main branch'ine push yapıldığında çalışır

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Tüm geçmişi çek ki sürümleme yapılabilsin
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Android APK (Debug)
      run: ./gradlew :app:assembleDebug
      
    - name: Build Desktop App
      run: ./gradlew :desktop:package
      
    - name: Generate Random Version Tag
      id: tag
      run: echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          app/build/outputs/apk/debug/*.apk
          desktop/build/compose/binaries/main-release/msi/*.msi
          desktop/build/compose/binaries/main-release/exe/*.exe
        tag_name: ${{ steps.tag.outputs.TAG_NAME }}
        name: Auto Release ${{ steps.tag.outputs.TAG_NAME }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
