<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AuroNova PTS Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #080808;
            --bg-card: #0d1117;
            --border-color: #333333;
            --accent-blue: #2f81f7;
            --accent-green: #238636;
            --accent-red: #da3633;
            --accent-orange: #f78166;
            --text-main: #adbac7;
            --text-muted: #768390;
        }
        * { box-sizing: border-box; outline: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #050505;
            color: var(--text-main);
            margin: 0;
            font-size: 15px;
            height: 100vh;
            overflow: hidden;
            display: flex;
            padding: 10px; /* Dış Çerçeve Boşluğu */
        }
        #app-root {
            width: 100%;
            height: 100%;
            display: flex;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px; /* Köşe Yuvarlaklığı */
            overflow: hidden;
            box-shadow: 0 4px 25px rgba(0,0,0,0.6); /* Şık Gölge */
        }

        nav { width: 260px; background-color: var(--bg-secondary); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px 0; }
        .nav-header { padding: 0 20px 20px 20px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        .nav-btn { padding: 14px 20px; cursor: pointer; color: var(--text-muted); border: none; background: none; text-align: left; width: 100%; font-size: 14px; display: flex; align-items: center; gap: 12px; }
        .nav-btn:hover { background: #1c2128; color: #fff; }
        .nav-btn.active { color: var(--accent-blue); background-color: #1c2128; border-left: 4px solid var(--accent-blue); font-weight: 800; }

        main { flex: 1; padding: 40px; overflow-y: auto; }
        .box { background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 10px; padding: 30px; margin-bottom: 25px; }
        .box-title { color: var(--accent-blue); font-weight: 700; font-size: 13px; text-transform: uppercase; margin-bottom: 20px; }

        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 13px; color: var(--text-muted); }
        input, select { width: 100%; background-color: var(--bg-primary); border: 1px solid var(--border-color); color: #fff; padding: 12px 18px; border-radius: 8px; font-size: 15px; margin-bottom: 15px; }
        input:focus { border-color: var(--accent-blue); }

        button { background-color: var(--accent-green); border: none; color: #fff; padding: 10px 22px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        button:hover { opacity: 0.9; }
        .btn-blue { background: var(--accent-blue); }
        .btn-danger { background: var(--accent-red); }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }

        h2 { font-size: 26px; margin-bottom: 25px; }
        .row { display: flex; gap: 20px; margin-bottom: 15px; }
        .col { flex: 1; }

        .tag { background: #1c2128; border: 1px solid var(--border-color); color: var(--accent-blue); padding: 5px 12px; border-radius: 15px; font-size: 11px; display: inline-flex; align-items: center; gap: 10px; }

        /* -- Dashboard Stat Kartlar -- */
        .stat-card { flex: 1; background: var(--bg-card); border: 1px solid var(--border-color); padding: 25px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; transition: border-color 0.2s, transform 0.2s; }
        .stat-card:hover { border-color: var(--accent-blue); transform: translateY(-2px); }
        .stat-card i { font-size: 22px; color: var(--accent-blue); background: rgba(47, 129, 247, 0.1); width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; border-radius: 12px; margin-bottom: 5px; }
        .stat-val { font-size: 32px; font-weight: 900; color: #fff; line-height: 1.2; }
        .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }


        .recent-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .recent-item:last-child { border-bottom: none; }

        .badge-premium { background: var(--accent-blue); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 800; }
        .badge-standart { background: var(--border-color); color: var(--text-muted); padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 800; }

        .lang-btn { background: transparent; border: 1px solid #333; color: var(--text-muted); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .lang-btn.active-lang { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
    </style>
</head>
<body>
    <div id="app-root"></div>
    <script src="ui_templates.js"></script>
    <script src="app_engine.js"></script>
</body>
</html>
